<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#10B981" stroke-width="12" />
  
  <!-- Mosque Dome Silhouette -->
  <path d="M 176,360 C 176,280 200,240 256,210 C 312,240 336,280 336,360 Z" fill="#047857" opacity="0.6" />
  <path d="M 200,360 C 200,300 220,270 256,245 C 292,270 312,300 312,360 Z" fill="#065F46" opacity="0.8" />

  <!-- Crescent Moon -->
  <path d="M 280,110 A 100,100 0 1,0 350,280 A 120,120 0 1,1 280,110 Z" fill="url(#goldGrad)" />
  
  <!-- 8-pointed Islamic Star or small star -->
  <polygon points="340,130 346,146 362,146 349,156 354,171 340,161 326,171 331,156 318,146 334,146" fill="url(#goldGrad)" />
  
  <!-- Heart/Tawbah Symbol Base -->
  <circle cx="256" cy="360" r="16" fill="url(#goldGrad)" />
</svg>
